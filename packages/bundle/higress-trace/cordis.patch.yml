# A deployment must replace this disabled row with its Trace Query URL and
# credential reference. No endpoint or credential is embedded in the bundle.
- insert:
    - id: invariants
      name: '@deepseek-ai/dsh-invariants'
    - id: gateway-trace-invariant
      name: '@deepseek-ai/dsh-gateway-trace/invariant'
    - id: gateway-trace-query
      name: '@deepseek-ai/dsh-gateway-trace-query'
      disabled: true
    - id: gateway-trace-console
      name: '@deepseek-ai/dsh-gateway-trace-console'
      disabled: true
    - id: telemetry-otel
      name: '@deepseek-ai/dsh-telemetry-otel'
      disabled: true
